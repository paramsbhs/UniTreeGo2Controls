[project]
name = "go2-wbc"
version = "0.1.0"
description = "Whole-body locomotion and state estimation for the Unitree Go2 quadruped in MuJoCo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "osqp>=0.6",
    "pin>=3.0",                 # Pinocchio (controller-side rigid-body model)
    "robot_descriptions>=1.12", # fetches the Go2 URDF for Pinocchio
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/go2_wbc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long simulation runs (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731"]   # short lambdas for height schedules are fine

[tool.ruff.lint.per-file-ignores]
"tests/test_pinocchio_fk.py" = ["E402"]   # imports after pytest.importorskip
"scripts/make_plots.py" = ["E402"]        # matplotlib.use() must precede pyplot import
